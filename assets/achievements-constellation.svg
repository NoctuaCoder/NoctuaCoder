<svg width="1000" height="520" viewBox="0 0 1000 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2026"/>
      <stop offset="50%" stop-color="#28323B"/>
      <stop offset="100%" stop-color="#1A2026"/>
    </linearGradient>

    <!-- Celestial Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B9C9" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFEBC9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9CA764" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="celestialGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starSparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      @keyframes slowFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes ringPulse {
        0%, 100% { r: 7px; opacity: 0.3; }
        50% { r: 12px; opacity: 0.8; }
      }
      .star-honey {
        fill: #FFEBC9;
        transform-origin: center;
        animation: twinkle 3s infinite ease-in-out;
      }
      .star-matcha {
        fill: #9CA764;
        transform-origin: center;
        animation: twinkle 4s infinite ease-in-out 1s;
      }
      .star-lilac {
        fill: #C4B9C9;
        transform-origin: center;
        animation: twinkle 3.5s infinite ease-in-out 0.5s;
      }
      .constellation {
        animation: slowFloat 7s infinite ease-in-out;
      }
      .c-line {
        stroke: #C4B9C9;
        stroke-width: 1.5;
        stroke-opacity: 0.55;
        stroke-linecap: round;
        stroke-dasharray: 4 2;
      }
      .c-line-solid {
        stroke: url(#lineGrad);
        stroke-width: 1.8;
        stroke-linecap: round;
      }
      .node-title {
        font-family: Georgia, 'Playfair Display', serif;
        fill: #FFEBC9;
        font-size: 16px;
        font-weight: 700;
        text-anchor: middle;
        letter-spacing: 0.5px;
      }
      .node-sub {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        fill: #C4B9C9;
        font-size: 11px;
        text-anchor: middle;
        letter-spacing: 1px;
      }
      .header-title {
        font-family: Georgia, serif;
        fill: #FFEBC9;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 3px;
        text-anchor: middle;
      }
      .header-sub {
        font-family: 'JetBrains Mono', monospace;
        fill: #9CA764;
        font-size: 11px;
        letter-spacing: 2px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Sky Card Background -->
  <rect width="1000" height="520" rx="16" fill="url(#skyGrad)" stroke="#52616D" stroke-width="1.2"/>

  <!-- Subtle Celestial Grid Lines -->
  <circle cx="500" cy="270" r="230" stroke="#52616D" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.4"/>
  <circle cx="500" cy="270" r="140" stroke="#52616D" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.3"/>
  <line x1="80" y1="270" x2="920" y2="270" stroke="#52616D" stroke-width="0.6" stroke-dasharray="4 8" opacity="0.3"/>

  <!-- Celestial Title Banner -->
  <g transform="translate(500, 38)">
    <text y="0" class="header-title">✦ NOCTUA LAB STELLAR CONSTELLATION ✦</text>
    <text y="20" class="header-sub">MAPPING LOCAL SYSTEMS &amp; AUTONOMOUS ENGINES</text>
  </g>

  <!-- Node 1: Corvus Noctua (noctua-niri) -->
  <g class="constellation" transform="translate(160, 110)">
    <!-- Constellation Lines -->
    <path class="c-line" d="M10 50 L45 20 L80 50 L65 95 L25 95 Z" />
    <path class="c-line-solid" d="M45 20 L45 70" />
    <!-- Stars -->
    <circle cx="45" cy="20" r="4.5" class="star-honey" filter="url(#celestialGlow)"/>
    <circle cx="10" cy="50" r="3.5" class="star-lilac"/>
    <circle cx="80" cy="50" r="3.5" class="star-lilac"/>
    <circle cx="25" cy="95" r="3.5" class="star-matcha"/>
    <circle cx="65" cy="95" r="3.5" class="star-matcha"/>
    <circle cx="45" cy="70" r="4" class="star-honey"/>
    <!-- Texts -->
    <text x="45" y="125" class="node-title">Corvus Noctua</text>
    <text x="45" y="143" class="node-sub">noctua-niri · Desktop</text>
  </g>

  <!-- Node 2: Lyra Analógica (noctua-player) -->
  <g class="constellation" transform="translate(500, 95)" style="animation-delay: -2s;">
    <!-- Cassette Reel / Lyra Form -->
    <path class="c-line" d="M15 35 L40 15 L70 15 L95 35 L75 80 L35 80 Z" />
    <path class="c-line-solid" d="M35 48 L75 48" />
    <circle cx="35" cy="48" r="8" stroke="#FFEBC9" stroke-width="1.2" fill="none" opacity="0.6"/>
    <circle cx="75" cy="48" r="8" stroke="#FFEBC9" stroke-width="1.2" fill="none" opacity="0.6"/>
    <!-- Stars -->
    <circle cx="40" cy="15" r="4" class="star-honey"/>
    <circle cx="70" cy="15" r="4" class="star-honey"/>
    <circle cx="15" cy="35" r="3.5" class="star-matcha"/>
    <circle cx="95" cy="35" r="3.5" class="star-matcha"/>
    <circle cx="35" cy="80" r="3.5" class="star-lilac"/>
    <circle cx="75" cy="80" r="3.5" class="star-lilac"/>
    <!-- Texts -->
    <text x="55" y="125" class="node-title">Lyra Analógica</text>
    <text x="55" y="143" class="node-sub">noctua-player · Audio</text>
  </g>

  <!-- Node 3: Orion Arbiter (ArbiterAI) -->
  <g class="constellation" transform="translate(830, 110)" style="animation-delay: -4s;">
    <!-- Diamond Shield Form -->
    <path class="c-line" d="M50 15 L90 50 L50 85 L10 50 Z" />
    <path class="c-line-solid" d="M50 15 L50 85" />
    <path class="c-line-solid" d="M10 50 L90 50" />
    <!-- Stars -->
    <circle cx="50" cy="15" r="4.5" class="star-honey" filter="url(#celestialGlow)"/>
    <circle cx="90" cy="50" r="3.5" class="star-matcha"/>
    <circle cx="50" cy="85" r="4" class="star-honey"/>
    <circle cx="10" cy="50" r="3.5" class="star-matcha"/>
    <circle cx="50" cy="50" r="5" class="star-honey" filter="url(#starSparkle)"/>
    <!-- Texts -->
    <text x="50" y="125" class="node-title">Orion Arbiter</text>
    <text x="50" y="143" class="node-sub">ArbiterAI · Local Agents</text>
  </g>

  <!-- Node 4: Cygnus Ferrugineus (voidkitty-llm) -->
  <g class="constellation" transform="translate(160, 310)" style="animation-delay: -1s;">
    <!-- Cross/Swan Form -->
    <path class="c-line" d="M45 10 L45 80 M15 35 L75 35 M25 65 L65 65" />
    <!-- Stars -->
    <circle cx="45" cy="10" r="4.5" class="star-honey"/>
    <circle cx="45" cy="35" r="5" class="star-matcha" filter="url(#celestialGlow)"/>
    <circle cx="15" cy="35" r="3.5" class="star-lilac"/>
    <circle cx="75" cy="35" r="3.5" class="star-lilac"/>
    <circle cx="25" cy="65" r="3" class="star-honey"/>
    <circle cx="65" cy="65" r="3" class="star-honey"/>
    <circle cx="45" cy="80" r="4" class="star-matcha"/>
    <!-- Texts -->
    <text x="45" y="115" class="node-title">Cygnus Ferrugineus</text>
    <text x="45" y="133" class="node-sub">voidkitty-llm · Rust GGUF</text>
  </g>

  <!-- Node 5: Pegasus Mesh (noctua-drop) -->
  <g class="constellation" transform="translate(500, 310)" style="animation-delay: -3s;">
    <!-- Winged Square Form -->
    <path class="c-line" d="M25 25 L85 25 L85 75 L25 75 Z" />
    <path class="c-line-solid" d="M85 25 L105 10 M85 75 L105 90" />
    <!-- Stars -->
    <circle cx="25" cy="25" r="4" class="star-honey"/>
    <circle cx="85" cy="25" r="4.5" class="star-matcha"/>
    <circle cx="85" cy="75" r="4" class="star-honey"/>
    <circle cx="25" cy="75" r="3.5" class="star-lilac"/>
    <circle cx="105" cy="10" r="3.5" class="star-honey"/>
    <circle cx="105" cy="90" r="3.5" class="star-honey"/>
    <!-- Texts -->
    <text x="55" y="115" class="node-title">Pegasus Mesh</text>
    <text x="55" y="133" class="node-sub">noctua-drop · Local P2P</text>
  </g>

  <!-- Node 6: Nocturne Aegis (nocturne-forge) -->
  <g class="constellation" transform="translate(830, 310)" style="animation-delay: -5s;">
    <!-- Shield & Beacon Form -->
    <path class="c-line" d="M50 15 L85 30 L85 60 L50 85 L15 60 L15 30 Z" />
    <path class="c-line-solid" d="M50 15 L50 85" />
    <!-- Stars -->
    <circle cx="50" cy="15" r="4.5" class="star-honey" filter="url(#celestialGlow)"/>
    <circle cx="85" cy="30" r="3.5" class="star-lilac"/>
    <circle cx="85" cy="60" r="3.5" class="star-matcha"/>
    <circle cx="50" cy="85" r="4" class="star-honey"/>
    <circle cx="15" cy="60" r="3.5" class="star-matcha"/>
    <circle cx="15" cy="30" r="3.5" class="star-lilac"/>
    <circle cx="50" cy="50" r="4" class="star-honey"/>
    <!-- Texts -->
    <text x="50" y="115" class="node-title">Nocturne Aegis</text>
    <text x="50" y="133" class="node-sub">nocturne-forge · Diagnostics</text>
  </g>

  <!-- Ambient Micro Stars -->
  <circle cx="90" cy="70" r="1.5" class="star-honey" style="animation-delay: 0.3s; opacity: 0.5;"/>
  <circle cx="340" cy="160" r="1.5" class="star-lilac" style="animation-delay: 1.1s; opacity: 0.6;"/>
  <circle cx="680" cy="120" r="1.5" class="star-honey" style="animation-delay: 1.7s; opacity: 0.5;"/>
  <circle cx="940" cy="220" r="1.5" class="star-matcha" style="animation-delay: 0.8s; opacity: 0.6;"/>
  <circle cx="320" cy="420" r="1.5" class="star-honey" style="animation-delay: 2.1s; opacity: 0.5;"/>
  <circle cx="700" cy="410" r="1.5" class="star-lilac" style="animation-delay: 1.4s; opacity: 0.5;"/>
  <circle cx="80" cy="460" r="1.5" class="star-matcha" style="animation-delay: 2.5s; opacity: 0.5;"/>
</svg>
