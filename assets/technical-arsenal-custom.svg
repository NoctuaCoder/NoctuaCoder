<svg width="900" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141b3d"/>
      <stop offset="100%" stop-color="#1e1440"/>
    </linearGradient>
    <linearGradient id="badgeBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d5acd"/>
      <stop offset="100%" stop-color="#c76b9e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .badge { transition: none; }
      .glowdot { animation: pulse 2.4s infinite ease-in-out; }
      @keyframes pulse { 0%,100%{opacity:.5;} 50%{opacity:1;} }
    </style>
  </defs>

  <!-- Row 1 -->
  <g transform="translate(0,0)">
    <!-- PYTHON -->
    <g transform="translate(0,10)">
      <rect width="160" height="42" rx="10" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
      <circle class="glowdot" cx="20" cy="21" r="3" fill="#e8b84b"/>
      <text x="36" y="26" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#e8e6ff" font-weight="600">PYTHON</text>
    </g>
    <!-- TYPESCRIPT -->
    <g transform="translate(172,10)">
      <rect width="190" height="42" rx="10" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
      <circle class="glowdot" cx="20" cy="21" r="3" fill="#5a8dd6"/>
      <text x="36" y="26" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#e8e6ff" font-weight="600">TYPESCRIPT</text>
    </g>
    <!-- RUST -->
    <g transform="translate(374,10)">
      <rect width="140" height="42" rx="10" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
      <circle class="glowdot" cx="20" cy="21" r="3" fill="#c77a4c"/>
      <text x="36" y="26" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#e8e6ff" font-weight="600">RUST</text>
    </g>
  </g>

  <!-- Row 2 -->
  <g transform="translate(0,64)">
    <!-- QML -->
    <g transform="translate(0,10)">
      <rect width="130" height="42" rx="10" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
      <circle class="glowdot" cx="20" cy="21" r="3" fill="#7ed6a5"/>
      <text x="36" y="26" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#e8e6ff" font-weight="600">QML</text>
    </g>
    <!-- DOCKER -->
    <g transform="translate(142,10)">
      <rect width="160" height="42" rx="10" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
      <circle class="glowdot" cx="20" cy="21" r="3" fill="#5ab0d6"/>
      <text x="36" y="26" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#e8e6ff" font-weight="600">DOCKER</text>
    </g>
    <!-- OLLAMA -->
    <g transform="translate(314,10)">
      <rect width="160" height="42" rx="10" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.2"/>
      <circle class="glowdot" cx="20" cy="21" r="3" fill="#c9bfff"/>
      <text x="36" y="26" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#e8e6ff" font-weight="600">OLLAMA</text>
    </g>
  </g>
</svg>