<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Catppuccin Mocha & Starry Sky Palette -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="50%" stop-color="#181825" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes shooting-star {
        0% { transform: translate(0, 0) opacity: 0; }
        10% { opacity: 1; }
        30% { transform: translate(-300px, 300px); opacity: 0; }
        100% { transform: translate(-300px, 300px); opacity: 0; }
      }
      @keyframes nebula-float {
        0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
        50% { transform: translateY(-10px) scale(1.05); opacity: 0.5; }
      }
      @keyframes star-twinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes pulse-bar {
        0%, 100% { width: 80%; }
        50% { width: 85%; }
      }
      .shooting { animation: shooting-star 5s infinite linear; opacity: 0; }
      .nebula { animation: nebula-float 10s infinite alternate ease-in-out; }
      .star { animation: star-twinkle 3s infinite ease-in-out; }
      .bar-anim { animation: pulse-bar 4s infinite ease-in-out; }
      
      .font-main { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-title { font-family: 'Georgia', serif; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#sky-grad)" />
  
  <!-- Nebula Clouds (Inspired by Star Field Pack) -->
  <ellipse class="nebula" cx="200" cy="380" rx="400" ry="100" fill="#cba6f7" fill-opacity="0.1" />
  <ellipse class="nebula" cx="1000" cy="380" rx="500" ry="120" fill="#89b4fa" fill-opacity="0.1" style="animation-delay: -2s;" />
  <ellipse class="nebula" cx="600" cy="400" rx="600" ry="80" fill="#1e1e2e" />

  <!-- Shooting Stars -->
  <line class="shooting" x1="1100" y1="50" x2="1050" y2="100" stroke="white" stroke-width="2" stroke-linecap="round" style="animation-delay: 0s;" />
  <line class="shooting" x1="800" y1="20" x2="750" y2="70" stroke="#cba6f7" stroke-width="1" stroke-linecap="round" style="animation-delay: 2s;" />
  <line class="shooting" x1="400" y1="10" x2="350" y2="60" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round" style="animation-delay: 3.5s;" />

  <!-- Twinkling Stars -->
  <circle class="star" cx="150" cy="80" r="1.5" fill="white" style="animation-delay: 0.2s;" />
  <circle class="star" cx="450" cy="120" r="1" fill="#cba6f7" style="animation-delay: 1.1s;" />
  <circle class="star" cx="850" cy="60" r="2" fill="#89b4fa" style="animation-delay: 2.3s;" />
  <circle class="star" cx="1050" cy="150" r="1.2" fill="white" style="animation-delay: 0.7s;" />
  <circle class="star" cx="300" cy="200" r="1" fill="white" style="animation-delay: 1.8s;" />

  <!-- Main Frame (Streamer Style) -->
  <rect x="50" y="50" width="1100" height="300" rx="20" stroke="url(#accent-grad)" stroke-width="1" stroke-opacity="0.3" fill="none" />
  
  <!-- Left Stats Panel -->
  <g transform="translate(80, 100)">
    <rect width="200" height="200" rx="15" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.1" />
    <text x="20" y="35" fill="#a6adc8" font-size="10" font-family="Arial" style="letter-spacing: 2px;">CHARACTER STATS</text>
    
    <text x="20" y="65" fill="#cdd6f4" font-size="12" class="font-main">INTELLIGENCE</text>
    <rect x="20" y="75" width="160" height="4" rx="2" fill="#313244" />
    <rect x="20" y="75" width="145" height="4" rx="2" fill="#89b4fa" class="bar-anim" />
    
    <text x="20" y="105" fill="#cdd6f4" font-size="12" class="font-main">CREATIVITY</text>
    <rect x="20" y="115" width="160" height="4" rx="2" fill="#313244" />
    <rect x="20" y="115" width="155" height="4" rx="2" fill="#cba6f7" />
    
    <text x="20" y="145" fill="#cdd6f4" font-size="12" class="font-main">SOVEREIGNTY</text>
    <rect x="20" y="155" width="160" height="4" rx="2" fill="#313244" />
    <rect x="20" y="155" width="130" height="4" rx="2" fill="#a6e3a1" />
  </g>

  <!-- Center Identity -->
  <g transform="translate(600, 200)">
    <text text-anchor="middle" class="font-title" font-size="64" fill="white" filter="url(#glow)" style="letter-spacing: 4px;">Noctua Coder</text>
    <text y="40" text-anchor="middle" class="font-main" font-size="16" fill="#cba6f7" style="letter-spacing: 6px; text-transform: uppercase; opacity: 0.8;">✦ Star Field Alchemist ✦</text>
    
    <!-- Decorative Stars -->
    <path d="M-120 -20 L-115 -25 L-120 -30 L-125 -25 Z" fill="white" class="star" />
    <path d="M120 20 L125 15 L120 10 L115 15 Z" fill="#89b4fa" class="star" style="animation-delay: 1s;" />
  </g>

  <!-- Right Info Panel -->
  <g transform="translate(920, 100)">
    <rect width="200" height="200" rx="15" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.1" />
    <text x="20" y="35" fill="#a6adc8" font-size="10" font-family="Arial" style="letter-spacing: 2px;">ACTIVE QUEST</text>
    
    <g transform="translate(20, 60)">
      <rect width="160" height="40" rx="8" fill="#cba6f7" fill-opacity="0.1" stroke="#cba6f7" stroke-opacity="0.2" />
      <text x="10" y="25" fill="#cba6f7" font-size="11" class="font-main">🌌 Sovereign Niri Shell</text>
    </g>
    
    <g transform="translate(20, 110)">
      <rect width="160" height="40" rx="8" fill="#89b4fa" fill-opacity="0.1" stroke="#89b4fa" stroke-opacity="0.2" />
      <text x="10" y="25" fill="#89b4fa" font-size="11" class="font-main">🤖 ArbiterAI Runtime</text>
    </g>
    
    <g transform="translate(20, 160)">
      <text x="0" y="20" fill="#a6e3a1" font-size="10" class="font-main">● SYSTEM ONLINE</text>
    </g>
  </g>

  <!-- Corner Accents -->
  <path d="M50 70 V50 H70" stroke="url(#accent-grad)" stroke-width="2" fill="none" />
  <path d="M1150 70 V50 H1130" stroke="url(#accent-grad)" stroke-width="2" fill="none" />
  <path d="M50 330 V350 H70" stroke="url(#accent-grad)" stroke-width="2" fill="none" />
  <path d="M1150 330 V350 H1130" stroke="url(#accent-grad)" stroke-width="2" fill="none" />

</svg>
