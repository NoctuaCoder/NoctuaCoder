<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Noctua Lab celestial header</title>
  <desc id="desc">A deep blue and violet night sky with a glowing golden crescent moon, constellation lines, and subtle stars.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d25"/>
      <stop offset="0.48" stop-color="#151b42"/>
      <stop offset="1" stop-color="#0b0d25"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6d5acd" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6d5acd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c76b9e" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c76b9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#d6a94d" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d6a94d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldMoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5c9"/>
      <stop offset="0.55" stop-color="#f2d889"/>
      <stop offset="1" stop-color="#c8973e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f2ff"/>
      <stop offset="0.5" stop-color="#d8d0ff"/>
      <stop offset="1" stop-color="#f4f2ff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="moonBlur"><feGaussianBlur stdDeviation="9"/></filter>
    <style>
      .tw { animation: tw 3.4s ease-in-out infinite; }
      .tw2 { animation: tw 3.4s ease-in-out infinite 0.8s; }
      .tw3 { animation: tw 3.4s ease-in-out infinite 1.7s; }
      .tw4 { animation: tw 3.4s ease-in-out infinite 2.4s; }
      @keyframes tw { 0%,100% { opacity:.28; } 50% { opacity:1; } }
      .drift { animation: drift 16s ease-in-out infinite; transform-origin: center; }
      @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(14px,-7px) scale(1.06); } }
      .draw { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 7s ease-out forwards infinite; }
      @keyframes draw { 0% { stroke-dashoffset:300; } 45%,85% { stroke-dashoffset:0; } 100% { stroke-dashoffset:-300; } }
      .moon { animation: moon 5s ease-in-out infinite; transform-origin: 1080px 72px; }
      @keyframes moon { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
      .shimmer { animation: shimmer 6s ease-in-out infinite; }
      @keyframes shimmer { 0%,100% { opacity:.88; } 50% { opacity:1; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>
  <g class="drift">
    <circle cx="165" cy="62" r="155" fill="url(#violetGlow)" filter="url(#blur)"/>
    <circle cx="1030" cy="235" r="170" fill="url(#roseGlow)" filter="url(#blur)"/>
  </g>
  <circle cx="595" cy="245" r="120" fill="url(#violetGlow)" opacity=".42" filter="url(#blur)"/>

  <g fill="#f4f2ff">
    <circle class="tw" cx="38" cy="34" r="1.1"/><circle class="tw2" cx="108" cy="82" r="1"/>
    <circle class="tw3" cx="180" cy="27" r="1.4"/><circle class="tw4" cx="248" cy="62" r=".9"/>
    <circle class="tw" cx="320" cy="25" r="1.1"/><circle class="tw2" cx="880" cy="28" r="1.1"/>
    <circle class="tw3" cx="944" cy="98" r=".9"/><circle class="tw4" cx="1020" cy="34" r="1.3"/>
    <circle class="tw" cx="1144" cy="40" r="1.1"/><circle class="tw2" cx="1168" cy="205" r="1"/>
    <circle class="tw3" cx="42" cy="234" r="1.1"/><circle class="tw4" cx="142" cy="270" r=".9"/>
    <circle class="tw" cx="314" cy="266" r="1"/><circle class="tw2" cx="850" cy="266" r="1.1"/>
    <circle class="tw3" cx="1064" cy="246" r="1.2"/><circle class="tw4" cx="1160" cy="120" r=".9"/>
  </g>

  <g fill="#ffe9a8">
    <path class="tw2" transform="translate(278 72) scale(.75)" d="M0-9 2.6-2.6 9 0 2.6 2.6 0 9-2.6 2.6-9 0-2.6-2.6Z"/>
    <path class="tw4" transform="translate(925 132) scale(.62)" d="M0-9 2.6-2.6 9 0 2.6 2.6 0 9-2.6 2.6-9 0-2.6-2.6Z"/>
    <path class="tw" transform="translate(220 216) scale(.48)" d="M0-9 2.6-2.6 9 0 2.6 2.6 0 9-2.6 2.6-9 0-2.6-2.6Z"/>
    <path class="tw3" transform="translate(982 238) scale(.7)" d="M0-9 2.6-2.6 9 0 2.6 2.6 0 9-2.6 2.6-9 0-2.6-2.6Z"/>
  </g>

  <!-- Aquarius constellation, kept subtle as a signature -->
  <g transform="translate(66 82)" fill="none" stroke="#c9bfff" stroke-width="1.1" opacity=".8">
    <path class="draw" d="M0 56 25 28 55 43 83 14 77 53 45 66 15 76 4 103 20 128 2 155"/>
    <g fill="#f4f2ff" stroke="none">
      <circle cx="0" cy="56" r="2.4"/><circle cx="25" cy="28" r="2.7"/><circle cx="55" cy="43" r="2.2"/>
      <circle cx="83" cy="14" r="3"/><circle cx="77" cy="53" r="2.2"/><circle cx="45" cy="66" r="2.4"/>
      <circle cx="15" cy="76" r="2.7"/><circle cx="4" cy="103" r="2.1"/><circle cx="20" cy="128" r="2"/><circle cx="2" cy="155" r="3"/>
    </g>
  </g>

  <!-- restrained celestial divider -->
  <g transform="translate(600 58)" stroke="#cfc7f5" stroke-width="1" opacity=".72">
    <line x1="-190" y1="0" x2="-18" y2="0"/><line x1="18" y1="0" x2="190" y2="0"/>
    <path d="M0-9 3-3 9 0 3 3 0 9-3 3-9 0-3-3Z" fill="#ffe9a8" stroke="none" class="tw"/>
  </g>

  <text x="600" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" letter-spacing="10" fill="url(#title)" class="shimmer">NOCTUA LAB</text>
  <text x="600" y="156" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="5.5" fill="#a99fd6">COMPILING THE NIGHT</text>
  <line x1="470" y1="190" x2="730" y2="190" stroke="#6d5acd" stroke-width="1" opacity=".7"/>
  <text x="600" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="3.5" fill="#c9bfff">LOCAL SYSTEMS · OPEN SOURCE · PRACTICAL AI</text>

  <!-- warm crescent moon -->
  <g class="moon">
    <circle cx="1080" cy="72" r="38" fill="url(#goldGlow)" filter="url(#moonBlur)" opacity=".65"/>
    <path d="M1092 47 A27 27 0 1 0 1092 97 A22 22 0 1 1 1092 47Z" fill="url(#goldMoon)"/>
    <circle cx="1108" cy="58" r="1.4" fill="#fff5c9" opacity=".8"/>
  </g>

  <!-- fine inner frame -->
  <rect x="18" y="18" width="1164" height="264" rx="14" fill="none" stroke="#6d5acd" stroke-opacity=".34"/>
  <rect x="25" y="25" width="1150" height="250" rx="11" fill="none" stroke="#c9bfff" stroke-opacity=".12"/>
</svg>
