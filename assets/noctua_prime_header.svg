<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#141b3d"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d5acd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6d5acd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c76b9e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c76b9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e6ff"/>
      <stop offset="50%" stop-color="#c9bfff"/>
      <stop offset="100%" stop-color="#e8e6ff"/>
    </linearGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="40"/></filter>

    <style>
      .tw { animation: tw 2.6s infinite ease-in-out; }
      .tw2 { animation-delay: .7s; }
      .tw3 { animation-delay: 1.4s; }
      .tw4 { animation-delay: 2.1s; }
      @keyframes tw { 0%,100%{opacity:.2;} 50%{opacity:1;} }

      .nebula-drift { animation: drift 14s infinite ease-in-out; }
      @keyframes drift {
        0%,100% { transform: translate(0,0) scale(1); }
        50% { transform: translate(20px,-10px) scale(1.08); }
      }

      .constellation-line {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: draw 4s ease-out forwards infinite;
      }
      @keyframes draw {
        0% { stroke-dashoffset: 400; }
        45% { stroke-dashoffset: 0; }
        85% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }

      .const-star {
        animation: constpulse 4s infinite ease-in-out;
      }
      @keyframes constpulse {
        0%,100% { opacity: .5; r: 2; }
        50% { opacity: 1; r: 3.2; }
      }

      .title-shimmer {
        animation: shimmer 5s linear infinite;
      }
      @keyframes shimmer {
        0% { fill: #e8e6ff; }
        50% { fill: #c9bfff; }
        100% { fill: #e8e6ff; }
      }

      .diamond-spin {
        animation: dspin 8s linear infinite;
        transform-origin: 600px 108px;
      }
      @keyframes dspin { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#sky)"/>

  <!-- nebula glows -->
  <g class="nebula-drift">
    <circle cx="180" cy="60" r="150" fill="url(#glow1)" filter="url(#softBlur)"/>
  </g>
  <g class="nebula-drift" style="animation-delay:-6s">
    <circle cx="1020" cy="230" r="170" fill="url(#glow2)" filter="url(#softBlur)"/>
  </g>
  <g class="nebula-drift" style="animation-delay:-3s">
    <circle cx="600" cy="250" r="130" fill="url(#glow1)" filter="url(#softBlur)" opacity="0.6"/>
  </g>

  <!-- background stars -->
  <g fill="#ffffff">
    <circle class="tw" cx="40" cy="40" r="1.2"/>
    <circle class="tw2" cx="90" cy="90" r="1"/>
    <circle class="tw3" cx="160" cy="30" r="1.4"/>
    <circle class="tw4" cx="230" cy="70" r="1"/>
    <circle class="tw" cx="300" cy="25" r="1.2"/>
    <circle class="tw2" cx="900" cy="40" r="1.3"/>
    <circle class="tw3" cx="960" cy="90" r="1"/>
    <circle class="tw4" cx="1030" cy="30" r="1.4"/>
    <circle class="tw" cx="1100" cy="70" r="1"/>
    <circle class="tw2" cx="1160" cy="25" r="1.2"/>
    <circle class="tw3" cx="60" cy="220" r="1.1"/>
    <circle class="tw4" cx="140" cy="260" r="1"/>
    <circle class="tw" cx="1080" cy="240" r="1.2"/>
    <circle class="tw2" cx="1150" cy="200" r="1"/>
    <circle class="tw3" cx="500" cy="30" r="1"/>
    <circle class="tw4" cx="700" cy="35" r="1.2"/>
    <circle class="tw" cx="400" cy="260" r="1"/>
    <circle class="tw2" cx="800" cy="265" r="1.1"/>
  </g>

  <!-- bright accent stars -->
  <circle class="tw3" cx="120" cy="150" r="6" fill="url(#starGlow)"/>
  <circle class="tw3" cx="120" cy="150" r="1.4" fill="#fff"/>
  <circle class="tw" cx="1070" cy="140" r="7" fill="url(#starGlow)"/>
  <circle class="tw" cx="1070" cy="140" r="1.6" fill="#fff"/>

  <!-- ============ AQUARIUS CONSTELLATION (left side, elegant) ============ -->
  <g transform="translate(60,90)">
    <path class="constellation-line" stroke="#c9bfff" stroke-width="1.2" fill="none" opacity="0.9"
          d="M 0 60 L 25 30 L 55 45 L 85 15 L 78 55 L 45 68 L 15 78 Z" />
    <path class="constellation-line" stroke="#c9bfff" stroke-width="1.2" fill="none" opacity="0.9" style="animation-delay:0.3s"
          d="M 15 78 L 5 105 L 22 130 L 3 158" />
    <g class="const-star" fill="#f4f2ff">
      <circle cx="0" cy="60" r="2.4"/><circle cx="25" cy="30" r="2.8"/><circle cx="55" cy="45" r="2.2"/>
      <circle cx="85" cy="15" r="3"/><circle cx="78" cy="55" r="2.2"/><circle cx="45" cy="68" r="2.4"/>
      <circle cx="15" cy="78" r="2.8"/><circle cx="5" cy="105" r="2.2"/><circle cx="22" cy="130" r="2"/>
      <circle cx="3" cy="158" r="3.2"/>
    </g>
  </g>

  <!-- decorative diamond top divider -->
  <g transform="translate(600,72)">
    <line x1="-190" y1="0" x2="-22" y2="0" stroke="#cfc7f5" stroke-width="1" opacity="0.7"/>
    <line x1="22" y1="0" x2="190" y2="0" stroke="#cfc7f5" stroke-width="1" opacity="0.7"/>
    <g class="diamond-spin">
      <path d="M0,-10 L3.4,-3.4 L10,0 L3.4,3.4 L0,10 L-3.4,3.4 L-10,0 L-3.4,-3.4 Z" fill="#f4f2ff"/>
    </g>
  </g>

  <!-- TITLE -->
  <text x="600" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="700" letter-spacing="10" class="title-shimmer">
    NOCTUA CODER
  </text>

  <text x="600" y="164" text-anchor="middle" font-family="Georgia, serif"
        font-size="14" letter-spacing="6" fill="#a99fd6">
    DIGITAL ALCHEMIST · SOVEREIGN SYSTEMS
  </text>

  <!-- bottom fine line + tag -->
  <line x1="450" y1="200" x2="750" y2="200" stroke="#544a8a" stroke-width="1" opacity="0.6"/>
  <text x="600" y="222" text-anchor="middle" font-family="Georgia, serif"
        font-size="11" letter-spacing="4" fill="#7c72ad">
    ✦ AQUARIUS SOUL ✦
  </text>

  <!-- small crescent moon top right -->
  <g transform="translate(1120,55)">
    <circle r="18" fill="url(#starGlow)" opacity="0.4"/>
    <path d="M 6 -10 A 10 10 0 1 0 6 10 A 8 8 0 1 1 6 -10 Z" fill="#f4f2ff" class="tw2"/>
  </g>
</svg>