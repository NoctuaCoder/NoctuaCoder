<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Celestial Palette -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes shooting-star {
        0% { transform: translate(0, 0); opacity: 0; }
        5% { opacity: 1; }
        15% { transform: translate(-400px, 400px); opacity: 0; }
        100% { transform: translate(-400px, 400px); opacity: 0; }
      }
      @keyframes cloud-drift {
        0%, 100% { transform: translateX(0); opacity: 0.4; }
        50% { transform: translateX(30px); opacity: 0.6; }
      }
      @keyframes star-pulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .shooting { animation: shooting-star 6s infinite linear; }
      .cloud { animation: cloud-drift 12s infinite alternate ease-in-out; }
      .star { animation: star-pulse 4s infinite ease-in-out; }
      .title-text { font-family: 'Georgia', serif; font-style: italic; letter-spacing: 6px; }
      .sub-text { font-family: 'Arial', sans-serif; letter-spacing: 3px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#sky-grad)" />
  
  <!-- Shooting Stars -->
  <line class="shooting" x1="1000" y1="0" x2="900" y2="100" stroke="white" stroke-width="1.5" stroke-linecap="round" style="animation-delay: 0s;" />
  <line class="shooting" x1="600" y1="-50" x2="500" y2="50" stroke="#cba6f7" stroke-width="1" stroke-linecap="round" style="animation-delay: 2.5s;" />
  <line class="shooting" x1="300" y1="0" x2="200" y2="100" stroke="#89b4fa" stroke-width="1" stroke-linecap="round" style="animation-delay: 4s;" />

  <!-- Stars -->
  <circle class="star" cx="100" cy="50" r="1.5" fill="white" style="animation-delay: 0.5s;" />
  <circle class="star" cx="300" cy="150" r="1" fill="#cba6f7" style="animation-delay: 1.2s;" />
  <circle class="star" cx="800" cy="80" r="2" fill="white" style="animation-delay: 2.1s;" />
  <circle class="star" cx="1100" cy="200" r="1.5" fill="#89b4fa" style="animation-delay: 0.8s;" />
  <circle class="star" cx="500" cy="30" r="1" fill="white" style="animation-delay: 1.5s;" />

  <!-- Celestial Clouds (Bottom Layer) -->
  <g class="cloud">
    <ellipse cx="200" cy="400" rx="300" ry="80" fill="#cba6f7" fill-opacity="0.15" />
    <ellipse cx="600" cy="410" rx="400" ry="100" fill="#89b4fa" fill-opacity="0.1" />
    <ellipse cx="1000" cy="400" rx="350" ry="90" fill="#cba6f7" fill-opacity="0.15" />
  </g>

  <!-- Central Frame -->
  <rect x="350" y="120" width="500" height="160" rx="20" fill="white" fill-opacity="0.02" stroke="white" stroke-opacity="0.1" style="backdrop-filter: blur(8px);" />
  
  <!-- Content -->
  <g filter="url(#soft-glow)">
    <text x="600" y="200" text-anchor="middle" class="title-text" font-size="52" fill="white">Noctua Coder</text>
    <text x="600" y="235" text-anchor="middle" class="sub-text" font-size="14" fill="#cba6f7">Digital Alchemist • Sovereign Systems</text>
  </g>

  <!-- Status Box (Bottom Left) -->
  <g transform="translate(60, 340)">
    <rect width="180" height="30" rx="15" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" />
    <circle cx="20" cy="15" r="4" fill="#a6e3a1">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="35" y="19" font-family="Arial" font-size="10" fill="#a6e3a1" style="letter-spacing: 1px;">SYSTEM: SOVEREIGN</text>
  </g>

  <!-- Telemetry (Bottom Right) -->
  <g transform="translate(960, 340)">
    <text x="0" y="19" font-family="Arial" font-size="10" fill="#a6adc8" text-anchor="end" style="letter-spacing: 1px;">LATENCY: LOCAL // OLLAMA ACTIVE</text>
  </g>

  <!-- Constellation Accents -->
  <path d="M50 50 L80 30 L110 60" stroke="white" stroke-width="0.5" stroke-opacity="0.3" fill="none" />
  <path d="M1100 300 L1130 330 L1150 310" stroke="white" stroke-width="0.5" stroke-opacity="0.3" fill="none" />

</svg>
