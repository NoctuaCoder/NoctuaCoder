<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">NoctuaCoder — Bruxinha Celestial</title>
  <desc id="desc">Uma bruxinha de capa roxa voa em uma vassoura sob uma lua crescente e um céu estrelado.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d35"/><stop offset="0.52" stop-color="#27205c"/><stop offset="1" stop-color="#0a1738"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%"><stop stop-color="#8e72df" stop-opacity=".24"/><stop offset="1" stop-color="#6e5ac8" stop-opacity="0"/></radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3ce"/><stop offset="1" stop-color="#d7b7ff"/></linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9d77ef"/><stop offset="1" stop-color="#4b2a98"/></linearGradient>
    <linearGradient id="broom" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f3c173"/><stop offset="1" stop-color="#9a4b76"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <style>
      .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 3.8s ease-in-out infinite}
      .float{animation:float 5s ease-in-out infinite}
      @keyframes twinkle{0%,100%{opacity:.35;transform:scale(.72)}50%{opacity:1;transform:scale(1.18)}}
      @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(1deg)}}
    </style>
  </defs>

  <rect width="1200" height="400" rx="22" fill="url(#sky)"/>
  <ellipse cx="650" cy="190" rx="410" ry="220" fill="url(#halo)" filter="url(#soft)"/>
  <path d="M22 28h1156v344H22z" fill="none" stroke="#a995ef" stroke-opacity=".55"/>
  <path d="M34 40h1132v320H34z" fill="none" stroke="#e3c8ff" stroke-opacity=".3"/>

  <g fill="#f9e8b2">
    <circle class="twinkle" cx="92" cy="86" r="2.5"/><circle class="twinkle" cx="178" cy="306" r="2" style="animation-delay:.8s"/>
    <circle class="twinkle" cx="1042" cy="90" r="2.4" style="animation-delay:1.1s"/><circle class="twinkle" cx="1090" cy="295" r="2" style="animation-delay:1.8s"/>
    <path class="twinkle" d="m288 74 4 10 10 4-10 4-4 10-4-10-10-4 10-4z" style="animation-delay:.4s"/>
    <path class="twinkle" d="m954 258 3 8 8 3-8 3-3 8-3-8-8-3 8-3z" style="animation-delay:1.5s"/>
    <path class="twinkle" d="m111 205 3 8 8 3-8 3-3 8-3-8-8-3 8-3z" style="animation-delay:2s"/>
  </g>
  <g fill="none" stroke="#8bb7ff" stroke-opacity=".35" stroke-width="1">
    <path d="M90 130h95m-70 12h62m-42 12h80"/><path d="M922 135h125m-90 12h72m-44 12h100"/>
  </g>

  <!-- crescent moon -->
  <g filter="url(#glow)">
    <circle cx="945" cy="116" r="74" fill="#d9c7ff" opacity=".12"/>
    <path d="M958 48a66 66 0 1 0 0 132 58 58 0 1 1 0-132Z" fill="url(#moon)"/>
    <circle cx="928" cy="88" r="5" fill="#a782cf" opacity=".3"/><circle cx="974" cy="137" r="7" fill="#a782cf" opacity=".25"/>
  </g>

  <!-- flying witch -->
  <g class="float" transform="translate(0 2)">
    <!-- magical trail -->
    <path d="M210 258c-75 18-90 48-150 34 67 1 76-42 150-53" fill="none" stroke="#d8b9ff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <path d="M196 276c-46 25-82 17-112 4" fill="none" stroke="#8fd1ff" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    <!-- broom -->
    <path d="M160 270c110-2 201-18 294-46" fill="none" stroke="#321d61" stroke-width="12" stroke-linecap="round"/>
    <path d="M160 270c110-2 201-18 294-46" fill="none" stroke="url(#broom)" stroke-width="5" stroke-linecap="round"/>
    <path d="M150 271c-23 15-31 34-22 51 13-16 27-22 42-21-17 15-18 30-8 42 18-23 35-34 49-34-9-15-18-27-33-38Z" fill="#c783bf" stroke="#5a327f" stroke-width="3"/>
    <!-- cloak and body -->
    <path d="M306 151c-32 8-56 34-62 75l-24 62c34 16 87 18 130 1l-24-67c17-22 12-58-20-71Z" fill="url(#robe)" stroke="#2d1b65" stroke-width="5"/>
    <path d="M280 229c22 18 46 26 73 27" fill="none" stroke="#cba9ff" stroke-opacity=".6" stroke-width="4"/>
    <path d="M251 285c28 7 61 6 94-2" fill="none" stroke="#e0c4ff" stroke-opacity=".55" stroke-width="3"/>
    <!-- head and hair -->
    <circle cx="301" cy="133" r="31" fill="#f8d8cf" stroke="#38206e" stroke-width="4"/>
    <path d="M271 145c-24-25-17-67 25-77 42-10 70 18 65 57-2 20-11 34-25 45-2-19-10-29-22-40-9 23-24 37-43 44Z" fill="#4a277f" stroke="#281852" stroke-width="5"/>
    <!-- witch hat -->
    <path d="M268 93c25-45 50-69 78-80-2 24 5 40 23 53l-9 17c-26-7-57-6-92 10Z" fill="#6d43b4" stroke="#2b185d" stroke-width="5"/>
    <path d="M244 92c39-16 87-14 135 2l-6 18c-45-9-88-8-134 5Z" fill="#3a206e" stroke="#251450" stroke-width="4"/>
    <path d="M286 98h68" stroke="#f0bd75" stroke-width="6"/>
    <!-- face, arm and wand -->
    <path d="M289 132q10 7 20 0" fill="none" stroke="#4b286d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="292" cy="124" r="2.5" fill="#4b286d"/><circle cx="312" cy="124" r="2.5" fill="#4b286d"/>
    <path d="M271 180c-18 2-35 7-52 19" fill="none" stroke="#f8d8cf" stroke-width="12" stroke-linecap="round"/>
    <path d="M219 199c-30-17-48-21-69-15" fill="none" stroke="#f8d8cf" stroke-width="9" stroke-linecap="round"/>
    <path d="M151 184c-12-15-17-25-20-39" fill="none" stroke="#c88663" stroke-width="3" stroke-linecap="round"/>
    <path d="m128 145 12-10m-12 10-14-4m14 4-3 14" stroke="#f9e8b2" stroke-width="3" stroke-linecap="round"/>
    <!-- boots -->
    <path d="M286 278c-8 18-20 26-36 30l25 6c16-5 25-14 30-28Z" fill="#2b1a5a"/>
    <path d="M333 276c-1 18 6 29 20 37l-28-5c-9-9-11-20-8-34Z" fill="#2b1a5a"/>
  </g>

  <g text-anchor="middle">
    <text x="655" y="245" fill="#fdf6e3" font-family="Georgia,serif" font-size="42" font-weight="bold" letter-spacing="8">NOCTUA NIGHT</text>
    <text x="655" y="278" fill="#d5baff" font-family="Georgia,serif" font-size="15" font-style="italic" letter-spacing="5">A LITTLE MAGIC IN EVERY LINE</text>
    <path d="M485 298h340" stroke="#cda9ff" stroke-opacity=".65"/>
    <path d="m655 288 4 8 8 4-8 4-4 8-4-8-8-4 8-4z" fill="#f9e8b2"/>
  </g>
  <text x="58" y="350" fill="#a997df" font-family="monospace" font-size="10" letter-spacing="3">CELESTIAL WITCHCRAFT · CODE BY NIGHT</text>
</svg>
