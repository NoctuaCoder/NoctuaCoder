<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">NOCTUA — Where systems become constellations</title>
  <desc id="desc">A deep purple celestial scene with gold orbital rings and small planets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0A2A"/><stop offset=".48" stop-color="#24154A"/><stop offset="1" stop-color="#3A1F63"/></linearGradient>
    <radialGradient id="nebula"><stop offset="0" stop-color="#8C63D8" stop-opacity=".24"/><stop offset="1" stop-color="#8C63D8" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun" cx="42%" cy="35%"><stop offset="0" stop-color="#FFF7D6"/><stop offset=".42" stop-color="#F6D98C"/><stop offset="1" stop-color="#C9963B"/></radialGradient>
    <linearGradient id="planetBlue"><stop stop-color="#A6C9B6"/><stop offset="1" stop-color="#3E828E"/></linearGradient>
    <linearGradient id="planetRose"><stop stop-color="#F6B6B7"/><stop offset="1" stop-color="#A66B9C"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .tw { animation: tw 3.8s ease-in-out infinite; }
      .tw2 { animation: tw 3.8s ease-in-out infinite .9s; }
      .tw3 { animation: tw 3.8s ease-in-out infinite 1.8s; }
      @keyframes tw { 0%,100% { opacity:.28; } 50% { opacity:1; } }
      .orbit { animation: orbit 18s linear infinite; transform-origin: 790px 150px; }
      @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <ellipse cx="790" cy="150" rx="430" ry="180" fill="url(#nebula)"/>
  <ellipse cx="1030" cy="70" rx="230" ry="120" fill="#F6B6B7" opacity=".07"/>
  <g fill="#F6FFFA" filter="url(#tinyGlow)"><circle cx="78" cy="54" r="1.3"/><circle cx="150" cy="235" r="1"/><circle cx="268" cy="44" r="1.4"/><circle cx="360" cy="258" r="1.1"/><circle cx="482" cy="54" r="1"/><circle cx="574" cy="236" r="1.2"/><circle cx="696" cy="35" r="1.1"/><circle cx="842" cy="261" r="1.3"/><circle cx="1005" cy="42" r="1"/><circle cx="1135" cy="224" r="1.3"/></g>
  <g fill="#F6D98C" opacity=".9"><path class="tw" d="M302 84l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path class="tw2" d="M1028 210l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z"/><path class="tw3" d="M1110 72l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z"/></g>
  <g>
    <ellipse cx="790" cy="150" rx="218" ry="73" fill="none" stroke="#DDB76A" stroke-width="1" opacity=".46" transform="rotate(-12 790 150)"/>
    <ellipse cx="790" cy="150" rx="164" ry="52" fill="none" stroke="#B6AAC7" stroke-width="1" stroke-dasharray="2 7" opacity=".66" transform="rotate(18 790 150)"/>
    <ellipse cx="790" cy="150" rx="112" ry="35" fill="none" stroke="#F6D98C" stroke-width="1.1" opacity=".58" transform="rotate(-27 790 150)"/>
    <circle cx="790" cy="150" r="27" fill="#F6D98C" opacity=".24" filter="url(#glow)"/><circle cx="790" cy="150" r="18" fill="url(#sun)"/>
    <g class="orbit">
      <circle cx="1008" cy="150" r="9" fill="url(#planetBlue)" stroke="#F6FFFA" stroke-width="1"/><ellipse cx="1008" cy="150" rx="14" ry="3" fill="none" stroke="#F6D98C" stroke-width="1" transform="rotate(18 1008 150)"/>
      <circle cx="954" cy="150" r="6" fill="url(#planetRose)" stroke="#F6FFFA" stroke-width=".8"/><circle cx="902" cy="150" r="4" fill="#B6AAC7"/>
    </g>
    <g fill="#F6FFFA" opacity=".9"><path d="M620 95l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path d="M935 205l1.5 5 5 1.5-5 1.5-1.5 5-1.5-5-5-1.5 5-1.5z"/></g>
  </g>
  <g fill="none" stroke="#DDB76A" opacity=".8"><rect x="24" y="22" width="1152" height="256" rx="18" stroke-width="1.2"/><rect x="31" y="29" width="1138" height="242" rx="14" stroke-width=".55" opacity=".58"/></g>
  <g transform="translate(92 108)" fill="#F6FFFA"><text x="0" y="0" font-family="JetBrains Mono,DejaVu Sans Mono,monospace" font-size="58" font-weight="700" letter-spacing="12">NOCTUA</text><rect x="4" y="22" width="172" height="2" rx="1" fill="#F6D98C" opacity=".9"/><text x="0" y="57" font-family="JetBrains Mono,DejaVu Sans Mono,monospace" font-size="15" letter-spacing="2.4" fill="#D8E6E8">WHERE SYSTEMS BECOME CONSTELLATIONS</text></g>
  <g transform="translate(95 211)" fill="#B6AAC7" opacity=".78"><circle cx="2" cy="-3" r="2"/><circle cx="15" cy="-3" r="2"/><circle cx="28" cy="-3" r="2"/><path d="M48-3h84" stroke="#A6C9B6" stroke-width="1" opacity=".6"/></g>
  <g fill="#F6D98C" filter="url(#tinyGlow)"><circle cx="62" cy="40" r="2"/><circle cx="1140" cy="256" r="2"/></g>
</svg>
