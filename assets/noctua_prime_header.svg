<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Celestial Night Palette -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1026" /> <!-- Deep Space -->
      <stop offset="100%" stop-color="#142B52" /> <!-- Midnight Blue -->
    </linearGradient>
    
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes shooting-star {
        0% { transform: translate(0, 0); opacity: 0; }
        5% { opacity: 1; }
        15% { transform: translate(-500px, 500px); opacity: 0; }
        100% { transform: translate(-500px, 500px); opacity: 0; }
      }
      @keyframes nebula-pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.05); }
      }
      @keyframes gold-pulse {
        0%, 100% { opacity: 0.4; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      @keyframes draw-line {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      .shooting { animation: shooting-star 7s infinite linear; }
      .nebula { animation: nebula-pulse 15s infinite alternate ease-in-out; }
      .constellation-star { animation: gold-pulse 4s infinite ease-in-out; }
      .constellation-line { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw-line 10s forwards ease-out; opacity: 0.3; }
      .title-text { font-family: 'Georgia', serif; font-style: italic; letter-spacing: 10px; text-transform: uppercase; }
      .sub-text { font-family: 'Arial', sans-serif; letter-spacing: 4px; text-transform: uppercase; font-weight: 300; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#sky-grad)" />
  
  <!-- Nebula Clouds -->
  <ellipse class="nebula" cx="300" cy="400" rx="500" ry="150" fill="#254A7A" fill-opacity="0.2" />
  <ellipse class="nebula" cx="900" cy="380" rx="600" ry="180" fill="#142B52" fill-opacity="0.3" style="animation-delay: -5s;" />

  <!-- Shooting Stars -->
  <line class="shooting" x1="1100" y1="0" x2="1000" y2="100" stroke="#F8F6EE" stroke-width="1" stroke-linecap="round" style="animation-delay: 1s;" />
  <line class="shooting" x1="400" y1="-50" x2="300" y2="50" stroke="#D4B06A" stroke-width="0.8" stroke-linecap="round" style="animation-delay: 4.5s;" />

  <!-- Background Stars -->
  <circle cx="200" cy="100" r="0.8" fill="white" opacity="0.5" />
  <circle cx="800" cy="50" r="0.5" fill="white" opacity="0.3" />
  <circle cx="1050" cy="300" r="0.7" fill="white" opacity="0.4" />
  <circle cx="50" cy="350" r="0.6" fill="white" opacity="0.2" />

  <!-- Aquarius Constellation (Stylized) -->
  <g transform="translate(100, 80)" stroke="#D4B06A" stroke-width="0.5">
    <!-- Stars -->
    <circle class="constellation-star" cx="50" cy="20" r="2.5" fill="#D4B06A" filter="url(#gold-glow)" /> <!-- Sadalmelik -->
    <circle class="constellation-star" cx="120" cy="50" r="2" fill="#D4B06A" style="animation-delay: 0.5s;" />
    <circle class="constellation-star" cx="180" cy="40" r="2.5" fill="#D4B06A" filter="url(#gold-glow)" style="animation-delay: 1s;" /> <!-- Sadalsuud -->
    <circle class="constellation-star" cx="240" cy="90" r="2" fill="#D4B06A" style="animation-delay: 1.5s;" />
    <circle class="constellation-star" cx="280" cy="150" r="3" fill="#D4B06A" filter="url(#gold-glow)" style="animation-delay: 2s;" /> <!-- Skat -->
    <circle class="constellation-star" cx="220" cy="180" r="2" fill="#D4B06A" style="animation-delay: 2.5s;" />
    <circle class="constellation-star" cx="150" cy="220" r="2.5" fill="#D4B06A" filter="url(#gold-glow)" style="animation-delay: 3s;" /> <!-- Sadachbia -->
    
    <!-- Lines -->
    <path class="constellation-line" d="M50 20 L120 50 L180 40 L240 90 L280 150 L220 180 L150 220" fill="none" />
  </g>

  <!-- Right Side Constellation Accent -->
  <g transform="translate(900, 200) rotate(15)" stroke="#D4B06A" stroke-width="0.5" opacity="0.4">
    <circle class="constellation-star" cx="0" cy="0" r="2" fill="#D4B06A" />
    <circle class="constellation-star" cx="50" cy="30" r="1.5" fill="#D4B06A" />
    <circle class="constellation-star" cx="30" cy="80" r="2" fill="#D4B06A" />
    <path d="M0 0 L50 30 L30 80" fill="none" />
  </g>

  <!-- Central Glass Identity -->
  <g transform="translate(600, 200)">
    <!-- Decorative Gold Lines -->
    <line x1="-250" y1="-60" x2="250" y2="-60" stroke="#D4B06A" stroke-width="0.5" opacity="0.3" />
    <line x1="-250" y1="60" x2="250" y2="60" stroke="#D4B06A" stroke-width="0.5" opacity="0.3" />
    <circle cx="0" y1="-60" r="3" fill="#D4B06A" filter="url(#gold-glow)" />
    
    <text text-anchor="middle" class="title-text" font-size="58" fill="#F8F6EE" filter="url(#gold-glow)">Noctua Coder</text>
    <text y="40" text-anchor="middle" class="sub-text" font-size="12" fill="#D4B06A">Digital Alchemist • Sovereign Systems • Aquarius Soul</text>
  </g>

  <!-- Corner Gold Accents -->
  <path d="M40 40 L80 40 M40 40 L40 80" stroke="#D4B06A" stroke-width="1" stroke-opacity="0.5" fill="none" />
  <path d="M1160 40 L1120 40 M1160 40 L1160 80" stroke="#D4B06A" stroke-width="1" stroke-opacity="0.5" fill="none" />
  <path d="M40 360 L80 360 M40 360 L40 320" stroke="#D4B06A" stroke-width="1" stroke-opacity="0.5" fill="none" />
  <path d="M1160 360 L1120 360 M1160 360 L1160 320" stroke="#D4B06A" stroke-width="1" stroke-opacity="0.5" fill="none" />

</svg>
